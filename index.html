<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- the browser tab title and the description shown in search results -->
<title>Valeria R</title>
<meta name="description" content="Mobile engineer. Find me on GitHub and LinkedIn.">

<style>
  :root {
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --text: #101828;
    --muted: #5B6577;
    --line: #E3E8F0;
    --focus: #0A66C2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1116;
      --surface: #171C24;
      --text: #F1F4F9;
      --muted: #9AA4B5;
      --line: #262D38;
      --focus: #6CB2FF;
    }
    .icon.github { background: #F1F4F9; color: #101828; }
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding: 3rem 1.25rem;
  }

  main { max-width: 26rem; margin: 0 auto; }

  /* Header: initials, name, one-line tagline */
  header { margin-bottom: 2rem; text-align: center; }
  .avatar {
    margin: 0 auto;
    width: 5.5rem;
    height: 5.5rem;
    border-radius: 50%;
    background: var(--text);
    color: var(--bg);
    display: grid;
    place-items: center;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  h1 {
    margin: 1rem 0 0.125rem;
    font-size: 1.875rem;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .tagline { margin: 0; color: var(--muted); }
  .about { margin: 1rem auto 0; max-width: 22rem; }

  /* The list of links: one grouped block, like a phone settings screen */
  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border-radius: 1.25rem;
    overflow: hidden;
  }
  .links li + li { border-top: 1px solid var(--line); }

  .links a {
    display: flex;
    align-items: center;
    gap: 0.875rem;
    min-height: 4.25rem;
    padding: 0.75rem 1rem;
    color: inherit;
    text-decoration: none;
    transition: background 0.15s;
  }
  .links a:hover,
  .links a:active { background: var(--line); }
  .links a:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  .icon {
    flex: none;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.65rem;
    display: grid;
    place-items: center;
    background: #667085;
    color: #fff;
    font-weight: 700;
  }
  .icon.github   { background: #24292F; }
  .icon.linkedin { background: #0A66C2; }

  .text { display: flex; flex-direction: column; min-width: 0; }
  .text strong { font-size: 1rem; }
  .text small {
    color: var(--muted);
    font-size: 0.875rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* The little arrow on the right */
  .chev {
    margin-left: auto;
    flex: none;
    width: 0.5rem;
    height: 0.5rem;
    border-top: 2px solid var(--muted);
    border-right: 2px solid var(--muted);
    transform: rotate(45deg);
  }

  @media (prefers-reduced-motion: reduce) {
    .links a { transition: none; }
  }
</style>
</head>

<body>
<main>

  <header>
    <div class="avatar" aria-hidden="true">VR</div>

    <p class="tagline">Mobile Engineer</p>

</html>
